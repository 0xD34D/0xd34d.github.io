{% assign domain = "www.youtube-nocookie.com" %}
{% assign path = "/embed/" %}

<style>
  .video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    margin: 1.5rem 0;
  }
  .video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>

<div class="video-container">
  <iframe 
    src="https://{{ domain }}{{ path }}{{ include.id }}" 
    title="{{ include.title | default: 'YouTube video player' }}"
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
    allowfullscreen>
  </iframe>
</div>
